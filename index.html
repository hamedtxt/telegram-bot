<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Position Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 select-none">

    <!-- هدر مینی‌اپ -->
    <div class="flex justify-between items-center mb-6 bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-lg font-bold">داشبورد معاملات زنده</h1>
        </div>
        <span class="text-xs text-slate-400" id="time-sync">در حال اتصال...</span>
    </div>

    <!-- بخش خلاصه وضعیت حساب -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <p class="text-xs text-slate-400 mb-1">موجودی حساب (Balance)</p>
            <p class="text-xl font-bold text-slate-200" id="balance">$0.00</p>
        </div>
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800">
            <p class="text-xs text-slate-400 mb-1">سرمایه فعال (Equity)</p>
            <p class="text-xl font-bold text-slate-200" id="equity">$0.00</p>
        </div>
    </div>

    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 mb-6 text-center">
        <p class="text-xs text-slate-400 mb-1">سود/زیان شناور کل (Total Floating PnL)</p>
        <p class="text-2xl font-bold text-slate-300" id="total-profit">$0.00</p>
    </div>

    <!-- لیست پوزیشن‌های باز -->
    <div class="mb-4">
        <h2 class="text-sm font-bold text-slate-400 mb-3 px-1">پوزیشن‌های باز اکسپرت</h2>
        <div class="space-y-3" id="positions-container">
            <div class="text-center py-8 text-slate-500 text-sm">در حال دریافت پوزیشن‌ها...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // تشخیص هوشمند و خودکار آدرس سرور بدون نیاز به وارد کردن دستی آدرس رندر
        const API_URL = window.location.origin + "/api/status"; 

        async function fetchLiveTrackerData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                document.getElementById('balance').innerText = `$${data.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                document.getElementById('equity').innerText = `$${data.equity.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                
                let totalProfit = 0;
                const container = document.getElementById('positions-container');
                container.innerHTML = ""; 

                if (!data.positions || data.positions.length === 0) {
                    container.innerHTML = `<div class="text-center py-8 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800 text-slate-500 text-sm">در حال حاضر هیچ پوزیشن فعالی وجود ندارد.</div>`;
                } else {
                    data.positions.forEach(pos => {
                        totalProfit += pos.profit;
                        const isBuy = pos.type === "BUY";
                        const profitColor = pos.profit >= 0 ? "text-emerald-400" : "text-rose-500";
                        const badgeColor = isBuy ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" : "bg-rose-500/10 text-rose-400 border-rose-500/20";

                        const card = `
                            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center animate-fade-in">
                                <div>
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-bold px-2 py-0.5 border rounded-md ${badgeColor}">${pos.type}</span>
                                        <span class="font-bold text-sm text-slate-200">${pos.symbol}</span>
                                        <span class="text-xs text-slate-500">Vol: ${pos.volume}</span>
                                    </div>
                                    <div class="text-xs text-slate-400">
                                        ورود: ${pos.open_price} ← فعلی: ${pos.current_price}
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="text-lg font-bold ${profitColor}">${pos.profit >= 0 ? '+' : ''}${pos.profit.toFixed(2)}$</span>
                                    <p class="text-[10px] text-slate-500">Ticket: #${pos.ticket}</p>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                }

                const totalProfitElement = document.getElementById('total-profit');
                totalProfitElement.innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
                if(totalProfit > 0) {
                    totalProfitElement.className = "text-2xl font-bold text-emerald-400";
                } else if(totalProfit < 0) {
                    totalProfitElement.className = "text-2xl font-bold text-rose-500";
                } else {
                    totalProfitElement.className = "text-2xl font-bold text-slate-300";
                }

                const now = new Date();
                document.getElementById('time-sync').innerText = `به‌روزرسانی: ${now.toLocaleTimeString('fa-IR')}`;

            } catch (error) {
                console.error("Error fetching tracker data:", error);
                document.getElementById('time-sync').innerText = "خطا در اتصال به سرور";
            }
        }

        fetchLiveTrackerData();
        // رفرش خودکار اطلاعات هر ۵ ثانیه یک‌بار
        setInterval(fetchLiveTrackerData, 5000);
    </script>
</body>
</html>
